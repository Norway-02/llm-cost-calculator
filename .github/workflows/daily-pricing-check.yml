name: Daily LLM Pricing Audit & Cloudflare Deploy

on:
  schedule:
    # Runs every day at 09:00 AM UTC (24/7 on Cloud servers)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pricing Dataset Validation
        run: npm run validate:pricing

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Static Export
        run: npm run build

      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
