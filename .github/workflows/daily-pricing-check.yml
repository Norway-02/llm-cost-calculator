name: Automated Daily Pricing Synchronization & Cloudflare Deploy

on:
  schedule:
    # Runs once per day at 06:00 AM UTC on GitHub Actions cloud infrastructure
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch & Synchronize Latest Provider Pricing Rates
        run: npm run update:pricing

      - name: Validate Pricing Invariants
        run: npm run validate:pricing

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Static Export
        run: npm run build

      - name: Commit Updated Pricing Data (If Changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/sync-metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pricing): automated daily pricing sync [$(date -u +'%Y-%m-%d')]" && git push)

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "41a8058780a273291594a5dc50a031ba"
          wranglerVersion: "4.127.1"
          command: deploy
